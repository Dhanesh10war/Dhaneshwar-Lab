<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #07080b;
      --border: #1e222d;
      --stroke: #ffffff;
      --core: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #e2e8f0;
        --stroke: #090d16;
        --core: #0284c7;
      }
    }
    .base-bg { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
    .glyph { stroke: var(--stroke); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .core-dot { fill: var(--core); }
  </style>

  <!-- Base App Tile with Smooth Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" class="base-bg" />

  <!-- Monogram D Backbone -->
  <path d="M10 8.5v15" class="glyph" />

  <!-- Monogram D Precision Arc -->
  <path d="M10 8.5h5.8a7.5 7.5 0 0 1 7.5 7.5v0a7.5 7.5 0 0 1-7.5 7.5H10" class="glyph" />

  <!-- Innovation Lab Quantum Core Pulse -->
  <circle cx="15" cy="16" r="2" class="core-dot" />
</svg>
